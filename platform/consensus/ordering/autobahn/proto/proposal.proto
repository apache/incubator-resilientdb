
syntax = "proto3";
import "common/proto/signature_info.proto";

package resdb.autobahn;

message Transaction{
  int32 id = 1;
  bytes data = 2;
  bytes hash = 3;
  int32 proxy_id = 4;
  int32 proposer_id = 5;
  int64 uid = 6;
  int64 create_time = 7;
  int64 queuing_time = 8;
}

message Header {
  bytes hash = 1;
  int32 height = 2;
  int32 proposer_id = 3;
  int32 proposal_id = 4;
  bytes prehash = 5;
}

message History {
  bytes hash = 1;
  int32 state = 2;
  int32 sender = 3;
}

message Cert {
  repeated SignatureInfo sign = 1;
}

message QC {
  repeated SignatureInfo signatures = 1;
  int32 view = 2;
  bytes hash = 3;
}

message Proposal {
  int32 slot_id = 1;
  int32 sender_id = 2;
  repeated Block block = 3;
  bool fast_commit = 4;
  SignatureInfo sign = 5;
  bytes hash = 6;
  Cert cert = 7;
  bytes parent_hash = 8;
  QC justify_qc = 9;
};

enum MessageType {
  NewProposal = 0;
  Vote = 1;
  Prepare = 2;
  VoteAck = 3;
  Commit = 4;
  Recovery = 5;
  NewBlocks = 6;
  ProposalAck = 7;
  CMD_BlockACK = 8;
  CMD_BlockQuery = 9;
  CMD_SingleBlock = 10;
  CMD_ProposalQuery = 11;
  CMD_ProposalQueryResponse = 12;
  CMD_NewLeader = 13;
  CMD_BlockReq = 14;
  CMD_BlockReqAck = 15;
  CMD_StateReq = 16;
  CMD_StateResp = 17;
  CMD_BlockBatchReq = 18;
  CMD_BlockBatchResp = 19;
};

message VoteMessage {
  bytes hash = 1;
  int32 proposer_id = 2;
  MessageType type = 3;
  int32 sender_id = 4;
  int32 proposal_id = 5;
};

message CommittedProposals{
  repeated Proposal proposals = 1;
  int32 sender_id = 2;
};

message HashValue{
	repeated uint64 bits = 1;
};

message SignInfo {
  bytes hash = 1;
  int32 sender_id = 2;
  int32 local_id = 3;
  SignatureInfo sign = 4;
}

message Block {
  message BlockData { 
    repeated Transaction transaction = 1;
  }
  BlockData data = 1;
  bytes hash = 2;
  int32 sender_id = 3;
  int32 local_id = 4;
  int64 create_time = 5;
  repeated SignInfo last_sign_info = 6;
  repeated SignInfo sign_info = 7;
  optional int32 responder = 8;
  optional bool is_recovery = 9;
}

message BlockACK {
  bytes hash = 2;
  int32 sender_id = 3;
  int32 local_id = 4;
  int32 responder = 5;
  SignInfo sign_info = 6;
}

message BlockBatch {
  int32 sender_id = 1;
  int32 owner_id = 2;
  int32 start_id = 3;
  int32 end_id = 4;
  repeated Block block = 5;
}

message BlockQuery {
  bytes hash = 2;
  int32 proposer = 3;
  int32 local_id = 4;
  int32 sender = 5;
}

message ProposalQuery {
  bytes hash = 2;
  int32 proposer = 3;
  int32 id = 4;
  int32 sender = 5;
}

message ProposalQueryResp {
  repeated Proposal proposal = 1;
}

message BlockHeight {
  int32 sender_id = 1;
  int32 block_id = 2;
}

message RecoveryState {
  int32 sender_id = 1;
  QC high_qc = 2;
  QC locked_qc = 3;
  repeated Proposal proposal = 4;
  repeated BlockHeight block_height = 5;
  int32 committed_slot = 6;
}

message ProposalResponse {
  Header header = 1;
  int32 leader = 2;
}

message VoteMsg {
  int32 slot_id = 1;
  int32 sender_id = 2;
  int32 leader = 3;
  QC high_qc = 4;
}
