syntax = "proto3";

package resdb.raft;

message Entry {
  uint64 term = 1;
  bytes command = 2;
}

message TruncationRecord {
  // Including this index, remove it and everything after it.
  uint64 truncate_from_index = 1;
  uint64 truncate_from_term = 2;
}

message WALRecord {
  uint64 seq = 1;
  oneof payload {
    Entry entry = 2;
    TruncationRecord truncation = 3;
  }
}

message AppendEntries {
  uint64 term = 1;
  int32 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated Entry entries = 5;
  uint64 leader_commit_index = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  int32 id = 3;
  uint64 last_log_index = 4;
  uint64 conflicting_index = 5;
  uint64 conflicting_term = 6;
}

message RequestVote {
  uint64 term = 1;
  int32 candidateId = 2;
  uint64 last_log_index = 3;
  uint64 lastLogTerm = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool voteGranted = 2;
  int32 voterId = 3;
}

message DirectToLeader {
  int32 leader_id = 2;
}

message InstallSnapshot {
  uint64 term = 1;
  int32 leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  uint64 offset = 5;
  bytes data = 6;
  bool done = 7;
}

message InstallSnapshotResponse {
  uint64 term = 1;
  int32 id = 2;
  // The byte offset the follower expects next.
  uint64 bytes_stored = 3;
  bool need_snapshot = 4;
  uint64 last_included_index = 5;
  bool transfer_complete = 6;
}

enum MessageType {
  None = 0;
  AppendEntriesMsg = 1;
  AppendEntriesResponseMsg = 2;
  RequestVoteMsg = 3;
  RequestVoteResponseMsg = 4;
  DirectToLeaderMsg = 5;
  InstallSnapshotMsg = 6;
  InstallSnapshotResponseMsg = 7;
}
