
syntax = "proto3";

package resdb.rcc;

message Transaction{
  int32 id = 1;
  bytes data = 2;
  bytes hash = 3;
  int32 proxy_id = 4;
  int64 create_time = 5;
  int64 queuing_time = 6;
}

enum ProposalType{
    NewMsg  = 0;
    Prepared = 1;
    Commit = 2;
    Ready_execute = 3;
    RecoverySync = 4;
    RecoveryAck = 5;
  };

message Header {
  bytes hash = 1;
  int32 seq = 2;
  int32 proposer_id = 3;
  int32 proposal_id = 4;
  int32 sender = 5;
  int64 create_time = 6;
  ProposalType status = 7;
  int64 recovery_epoch = 8;
  int64 recovery_round = 9;
  int32 recovery_target = 10;
}

message Proposal {
  
    Header header = 1;
  repeated Transaction transactions = 3;
  int64 queuing_time = 4;
  repeated Proposal proposals = 5;
};

enum MessageType {
  NewProposal = 0;
  ConsensusMsg = 1;
  ConsensusMsgExt = 2;
  SeqSync = 3;
};

message SyncMsg {
  int32 sender = 1;
  int64 seq = 2;
};

