syntax = "proto3";

import "common/proto/signature_info.proto";

package resdb.spotless;

message Transaction {
  int32 id = 1;
  bytes data = 2;
  bytes hash = 3;
  int32 proxy_id = 4;
  int32 proposer = 5;
  uint64 timestamp = 6;
  int64 user_seq = 7;
repeated Transaction subtxn = 8;
}

message Claim {
  int32 instance_id = 1;
  int32 view = 2;
  bytes hash = 3;
  bytes prehash = 4;
  int32 proposer_id = 5;
}

message Certificate {
  int32 instance_id = 1;
  int32 view = 2;
  bytes hash = 3;
  repeated SignatureInfo signatures = 4;
  repeated int32 signer_ids = 5;
}

message Header {
  int32 instance_id = 1;
  int32 proposer_id = 2;
  int32 sender_id = 3;
  int32 view = 4;
  bytes prehash = 5;
  Certificate justify = 6;
  uint64 create_time = 7;
}

message Proposal {
  Header header = 1;
  repeated Transaction transactions = 2;
  bytes hash = 3;
  uint64 create_time = 4;
}

message SyncMessage {
  int32 instance_id = 1;
  int32 view = 2;
  int32 sender_id = 3;
  Claim claim = 4;
  SignatureInfo sign = 5;
  Certificate highest_cert = 6;
  bool retransmit = 7;
  Proposal proposal = 8;
}

message RapidSync {
  int32 instance_id = 1;
  int32 from_view = 2;
  int32 target_view = 3;
  int32 sender_id = 4;
  Certificate highest_cert = 5;
  bool retransmit = 6;
  SignatureInfo sign = 7;
}

enum MessageType {
  ProposalMsg = 0;
  SyncMsg = 1;
  RapidSyncMsg = 2;
}
