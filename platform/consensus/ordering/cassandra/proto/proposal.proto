
syntax = "proto3";

package resdb.cassandra;


message Transaction{
  int32 id = 1;
  bytes data = 2;
  bytes hash = 3;
  int32 proxy_id = 4;
  int32 proposer_id = 5;
  int64 uid = 6;
  int64 create_time = 7;
  int64 queuing_time = 8;
}

message Certificate {
  enum State {
    State_New = 0;
    State_PoA = 1;
    State_PoR = 2;
  };
  
  State state = 1;
}

message Header {
  bytes hash = 1;
  int32 height = 2;
  int32 proposer_id = 3;
  int32 proposal_id = 4;
  bytes prehash = 5;
  int32 sender_id = 6;
  Certificate cert = 7;
  int32 pre_proposal_id = 8;
  int32 pre_proposer_id = 9;
}

message History {
  bytes hash = 1;
  int32 state = 2;
  int32 sender = 3;
  int32 id = 4;
}

message Proposal {
  Header header = 1;
  repeated History history = 2;
  int32 nonce = 3;
  repeated Transaction transactions = 4;
  uint64 create_time = 5;
  repeated Block block = 6;
  repeated Block sub_block = 8;
  Proposal pre_p = 9;
  optional int32 pre_s = 10;
};

enum MessageType {
  NewProposal = 0;
  Vote = 1;
  Prepare = 2;
  VoteAck = 3;
  Commit = 4;
  Recovery = 5;
  NewBlocks = 6;
  ProposalAck = 7;
  CMD_BlockACK = 8;
  CMD_BlockQuery = 9;
  CMD_SingleBlock = 10;
  CMD_ProposalQuery = 11;
  CMD_ProposalQueryResponse = 12;
  CMD_ProposalVote = 13;
  CMD_SyncRound = 14;
  CMD_SyncRoundAck = 15;
  CMD_AskProposal = 16;
  CMD_AskProposalAck = 17;
};

message VoteMessage {
  bytes hash = 1;
  int32 proposer_id = 2;
  MessageType type = 3;
  int32 sender_id = 4;
  int32 proposal_id = 5;
};

message CommittedProposals{
  repeated Proposal proposals = 1;
  int32 sender_id = 2;
};

message HashValue{
	repeated uint64 bits = 1;
};

message Block {
  message BlockData { 
    repeated Transaction transaction = 1;
  }
  BlockData data = 1;
  bytes hash = 2;
  int32 sender_id = 3;
  int32 local_id = 4;
  int64 create_time = 5;
  Block pre = 6;
  repeated int32 cut = 7;
}

message BlockACK {
  bytes hash = 2;
  int32 sender_id = 3;
  int32 local_id = 4;
  int32 responder = 5;
}

message BlockQuery {
  bytes hash = 2;
  int32 proposer = 3;
  int32 local_id = 4;
  int32 sender = 5;
}

message ProposalQuery {
  bytes hash = 2;
  int32 proposer = 3;
  int32 id = 4;
  int32 sender = 5;
  int32 round = 6;
}

message ProposalQueryResp {
  repeated Proposal proposal = 1;
  optional int32 sender = 2;
  optional int32 round = 3;
  optional int32 max_round = 4;
  optional int32 id = 5;
}

message ProposalResponse {
  Header header = 1;
  int32 leader = 2;
}

